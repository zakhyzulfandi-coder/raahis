<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="transparent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SISFO AHIS">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>SISFO AHIS</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root {
      --text: #111827;
      --muted: #64748b;
      --gold: #c79a2d;
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      touch-action: manipulation;
    }

    body {
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: 0;
      display: block;
      background: transparent !important;
    }

    .status-banner {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + var(--safe-bottom));
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(15, 23, 42, .94);
      color: white;
      box-shadow: 0 16px 44px rgba(0,0,0,.26);
      font-size: 13px;
      line-height: 1.35;
    }

    .status-banner.show {
      display: flex;
    }

    .status-banner button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
      background: white;
      color: #0f172a;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    title="SISFO AHIS"
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen; web-share"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <div class="status-banner" id="offlineBanner">
    <span>Perangkat sedang offline. Beberapa fitur mungkin belum dapat dipakai.</span>
    <button type="button" onclick="location.reload()">Muat ulang</button>
  </div>

  <div class="status-banner" id="updateBanner">
    <span>Update aplikasi tersedia. Muat ulang untuk memakai versi terbaru.</span>
    <button type="button" id="reloadUpdate">Update</button>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      const config = window.AHIS_CONFIG || {};
      const appUrl = config.APP_URL || "";

      const frame = document.getElementById("appFrame");
      const offlineBanner = document.getElementById("offlineBanner");
      const updateBanner = document.getElementById("updateBanner");
      const reloadUpdate = document.getElementById("reloadUpdate");

      document.title = config.APP_NAME || "SISFO AHIS";

      function loadApp() {
        const separator = appUrl.includes("?") ? "&" : "?";
        frame.src = appUrl + separator + "wrapper=github&t=" + Date.now();
      }

      function updateOnlineStatus() {
        offlineBanner.classList.toggle("show", !navigator.onLine);
      }

      window.addEventListener("online", updateOnlineStatus);
      window.addEventListener("offline", updateOnlineStatus);
      updateOnlineStatus();

      loadApp();

      // Service Worker Registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            const reg = await navigator.serviceWorker.register("service-worker.js");

            reg.addEventListener("updatefound", () => {
              const newWorker = reg.installing;
              if (!newWorker) return;

              newWorker.addEventListener("statechange", () => {
                if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                  updateBanner.classList.add("show");
                }
              });
            });
          } catch (err) {
            console.warn("Service worker gagal didaftarkan:", err);
          }
        });

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          window.location.reload();
        });
      }

      reloadUpdate.addEventListener("click", async () => {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const reg of registrations) {
          if (reg.waiting) {
            reg.waiting.postMessage({ type: "SKIP_WAITING" });
            return;
          }
        }
        window.location.reload();
      });

      // Mencegah zoom di iOS/mobile
      document.addEventListener("gesturestart", (e) => e.preventDefault());
      document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
    })();
  </script>
</body>
</html>
