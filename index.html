<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="transparent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SISFO AHIS">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>SISFO AHIS</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root {
      --text: #111827;
      --muted: #64748b;
      --gold: #c79a2d;
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      touch-action: manipulation;
    }

    body {
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }

    #appFrame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      border: 0;
      display: block;
      background: transparent !important;
    }

    .status-banner {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + var(--safe-bottom));
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(15, 23, 42, .94);
      color: white;
      box-shadow: 0 16px 44px rgba(0,0,0,.26);
      font-size: 13px;
      line-height: 1.35;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .status-banner.show {
      display: flex;
    }

    .status-banner button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
      background: white;
      color: #0f172a;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Diletakkan sedikit lebih tinggi agar tidak bertumpuk dengan banner offline/update. */
    #hapticBanner {
      bottom: calc(78px + var(--safe-bottom));
      background: rgba(127, 29, 29, .96);
    }

    #hapticBanner button {
      color: #991b1b;
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    title="SISFO AHIS"
    allow="geolocation; camera; microphone; gyroscope; accelerometer; magnetometer; clipboard-read; clipboard-write; fullscreen; web-share"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <div class="status-banner" id="offlineBanner" aria-live="polite">
    <span>Perangkat sedang offline. Beberapa fitur mungkin belum dapat dipakai.</span>
    <button type="button" onclick="location.reload()">Muat ulang</button>
  </div>

  <div class="status-banner" id="updateBanner" aria-live="polite">
    <span>Update aplikasi tersedia. Muat ulang untuk memakai versi terbaru.</span>
    <button type="button" id="reloadUpdate">Update</button>
  </div>

  <div class="status-banner" id="hapticBanner" aria-live="polite">
    <span>Aktifkan getaran perangkat agar penanda arah kiblat dapat bekerja.</span>
    <button type="button" id="enableHaptic">Aktifkan</button>
  </div>

  <script src="config.js"></script>
  <script>
    (function () {
      "use strict";

      const WRAPPER_VERSION = "2026.07.19.05-direct-vibration-fallback";
      const SESSION_STORAGE_KEY = "ahis_wrapper_session_v1";

      const config = window.AHIS_CONFIG || {};
      const appUrl = String(config.APP_URL || "").trim();
      const appName = String(config.APP_NAME || "SISFO AHIS").trim() || "SISFO AHIS";

      const frame = document.getElementById("appFrame");
      const offlineBanner = document.getElementById("offlineBanner");
      const updateBanner = document.getElementById("updateBanner");
      const reloadUpdate = document.getElementById("reloadUpdate");
      const hapticBanner = document.getElementById("hapticBanner");
      const enableHaptic = document.getElementById("enableHaptic");

      let hapticActivated = false;

      document.title = appName;
      frame.title = appName;

      const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (appleTitle) appleTitle.setAttribute("content", appName);

      function loadApp() {
        if (!appUrl) {
          console.error("APP_URL belum tersedia pada config.js.");
          return;
        }

        const separator = appUrl.includes("?") ? "&" : "?";
        frame.src = appUrl + separator +
          "wrapper=github" +
          "&wrapperVersion=" + encodeURIComponent(WRAPPER_VERSION) +
          "&t=" + Date.now();
      }

      function updateOnlineStatus() {
        offlineBanner.classList.toggle("show", !navigator.onLine);
      }

      window.addEventListener("online", updateOnlineStatus);
      window.addEventListener("offline", updateOnlineStatus);
      updateOnlineStatus();

      /**************************************************************
       * SESSION BRIDGE PERMANEN
       *
       * Apps Script berjalan di dalam iframe lintas domain. Pada
       * sebagian Android WebView, localStorage iframe dapat hilang atau
       * tidak terbaca setelah aplikasi dihentikan. Karena itu sesi juga
       * disimpan pada halaman GitHub yang menjadi top-level PWA.
       **************************************************************/
      function isValidSession(sessionData) {
        return Boolean(
          sessionData &&
          sessionData.user &&
          String(sessionData.user.user || "").trim()
        );
      }

      function readSession() {
        try {
          const raw = localStorage.getItem(SESSION_STORAGE_KEY);
          if (!raw) return null;

          const data = JSON.parse(raw);
          if (!isValidSession(data)) {
            localStorage.removeItem(SESSION_STORAGE_KEY);
            return null;
          }

          return data;
        } catch (error) {
          console.warn("Sesi wrapper gagal dibaca:", error);
          return null;
        }
      }

      function saveSession(sessionData) {
        if (!isValidSession(sessionData)) return false;

        try {
          const normalized = Object.assign({}, sessionData, {
            bridgeVersion: Number(sessionData.bridgeVersion || 1),
            wrapperSavedAt: Date.now(),
            wrapperVersion: WRAPPER_VERSION
          });

          localStorage.setItem(
            SESSION_STORAGE_KEY,
            JSON.stringify(normalized)
          );

          return true;
        } catch (error) {
          console.warn("Sesi wrapper gagal disimpan:", error);
          return false;
        }
      }

      function clearSession() {
        try {
          localStorage.removeItem(SESSION_STORAGE_KEY);
          return true;
        } catch (error) {
          console.warn("Sesi wrapper gagal dihapus:", error);
          return false;
        }
      }

      function replySession(targetWindow, requestId, sessionData) {
        if (!targetWindow) return;

        try {
          targetWindow.postMessage({
            type: "AHIS_SESSION_RESPONSE",
            requestId: requestId || "",
            sessionData: sessionData || null,
            wrapperVersion: WRAPPER_VERSION
          }, "*");
        } catch (error) {
          console.warn("Jawaban session bridge gagal dikirim:", error);
        }
      }

      /**************************************************************
       * VIBRATION / HAPTIC BRIDGE UNTUK KOMPAS KIBLAT
       **************************************************************/
      function normalizeVibratePattern(pattern) {
        const source = Array.isArray(pattern) ? pattern : [pattern];

        return source.slice(0, 20).map((value) => {
          const number = Math.round(Number(value) || 0);
          return Math.max(0, Math.min(1000, number));
        });
      }

      function sendVibrateResponse(targetWindow, payload) {
        if (!targetWindow) return;

        try {
          targetWindow.postMessage(Object.assign({
            type: "AHIS_VIBRATE_RESPONSE",
            wrapperVersion: WRAPPER_VERSION
          }, payload || {}), "*");
        } catch (error) {
          console.warn("Jawaban vibration bridge gagal dikirim:", error);
        }
      }

      function runVibration(pattern) {
        if (typeof navigator.vibrate !== "function") return false;

        const normalized = normalizeVibratePattern(pattern);
        const duration = normalized.length ? normalized[0] : 50;

        try {
          /* Mengikuti fungsi pembanding yang berhasil: gunakan angka tunggal. */
          return navigator.vibrate(duration || 50) !== false;
        } catch (error) {
          console.warn("Getaran wrapper gagal:", error);
          return false;
        }
      }

      function sendHapticReady() {
        if (!frame || !frame.contentWindow) return;

        try {
          frame.contentWindow.postMessage({
            type: "AHIS_VIBRATE_READY",
            wrapperVersion: WRAPPER_VERSION
          }, "*");
        } catch (error) {
          console.warn("Status getaran gagal dikirim:", error);
        }
      }

      enableHaptic.addEventListener("click", function () {
        const ok = runVibration(50);
        hapticBanner.classList.remove("show");

        if (ok) {
          hapticActivated = true;
          sendHapticReady();
        } else {
          hapticActivated = false;
          hapticBanner.querySelector("span").textContent =
            "Getaran tidak didukung atau dinonaktifkan pada perangkat ini.";
          hapticBanner.classList.add("show");
        }
      });

      /**************************************************************
       * SATU MESSAGE HANDLER UNTUK SESSION DAN GETARAN
       **************************************************************/
      window.addEventListener("message", function (event) {
        const data = event.data || {};

        /* Hanya menerima pesan dari iframe Apps Script aktif. */
        if (!frame || event.source !== frame.contentWindow) return;

        if (data.type === "AHIS_SESSION_SAVE") {
          saveSession(data.sessionData);
          return;
        }

        if (data.type === "AHIS_SESSION_CLEAR") {
          clearSession();
          return;
        }

        if (data.type === "AHIS_SESSION_GET") {
          replySession(event.source, data.requestId, readSession());
          return;
        }

        if (data.type === "AHIS_VIBRATE_REQUEST") {
          const requestId = data.requestId || "";
          const reason = String(data.reason || "general");

          if (typeof navigator.vibrate !== "function") {
            sendVibrateResponse(event.source, {
              requestId: requestId,
              reason: reason,
              ok: false,
              supported: false,
              needsActivation: false
            });
            return;
          }

          /*
           * Tidak lagi menunggu tombol aktivasi. Wrapper langsung mencoba
           * navigator.vibrate(50), sama seperti HTML pembanding yang berhasil.
           */
          const ok = runVibration(data.pattern || 50);

          if (ok) {
            hapticActivated = true;
            hapticBanner.classList.remove("show");
          } else {
            hapticActivated = false;
            hapticBanner.querySelector("span").textContent =
              "Getaran tidak berhasil. Pastikan mode getar perangkat aktif.";
            hapticBanner.classList.add("show");
          }

          sendVibrateResponse(event.source, {
            requestId: requestId,
            reason: reason,
            ok: ok,
            supported: true,
            needsActivation: false
          });
        }
      }, false);

      /* Memuat Apps Script setelah bridge sudah siap menerima pesan. */
      loadApp();

      // Service Worker Registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            const reg = await navigator.serviceWorker.register(
              "service-worker.js?v=" + encodeURIComponent(WRAPPER_VERSION)
            );

            reg.addEventListener("updatefound", () => {
              const newWorker = reg.installing;
              if (!newWorker) return;

              newWorker.addEventListener("statechange", () => {
                if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                  updateBanner.classList.add("show");
                }
              });
            });

            /* Memeriksa update ketika PWA dibuka kembali. */
            if (reg.update) {
              setTimeout(() => reg.update(), 2500);
            }
          } catch (err) {
            console.warn("Service worker gagal didaftarkan:", err);
          }
        });

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          window.location.reload();
        });
      }

      reloadUpdate.addEventListener("click", async () => {
        if (!("serviceWorker" in navigator)) {
          window.location.reload();
          return;
        }

        const registrations = await navigator.serviceWorker.getRegistrations();

        for (const reg of registrations) {
          if (reg.waiting) {
            reg.waiting.postMessage({ type: "SKIP_WAITING" });
            return;
          }
        }

        window.location.reload();
      });

      // Mencegah zoom di iOS/mobile
      document.addEventListener("gesturestart", (event) => event.preventDefault());
      document.addEventListener("dblclick", (event) => event.preventDefault(), { passive: false });
    })();
  </script>
</body>
</html>
